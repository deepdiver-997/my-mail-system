name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- 单元测试 (Debug 构建全部单测 + 运行 ctest) ----
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libspdlog-dev libc-ares-dev \
                                  libmysqlclient-dev libboost-system-dev libboost-thread-dev \
                                  nlohmann-json3-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build unit tests
        run: cmake --build build --target smtps_fsm_test smtps_fsm_concurrency_test \
                                imaps_fsm_test test_inbound_verifier outbound_smoke \
                                sql_queries_test mime_parser_test -j$(nproc)

      - name: Run unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

  # ---- 完整构建 (确认所有 target 能编译) ----
  full-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libspdlog-dev libc-ares-dev \
                                  libmysqlclient-dev libboost-system-dev libboost-thread-dev \
                                  nlohmann-json3-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all
        run: cmake --build build -j$(nproc)
