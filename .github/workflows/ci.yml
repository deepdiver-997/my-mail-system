name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- 单元测试 (Debug 构建全部单测 + 运行 ctest) ----
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libspdlog-dev libc-ares-dev \
                                  libmysqlclient-dev libboost-system-dev libboost-thread-dev \
                                  nlohmann-json3-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build unit tests
        # unit_tests 是 CMake 里的聚合 target，新增单测自动包含
        run: cmake --build build --target unit_tests -j$(nproc)

      - name: Run unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

  # ---- 完整构建 (确认所有 target 能编译) ----
  full-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libspdlog-dev libc-ares-dev \
                                  libmysqlclient-dev libboost-system-dev libboost-thread-dev \
                                  nlohmann-json3-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all
        run: cmake --build build -j$(nproc)

  # ---- Fuzz 冒烟（MIME 解析器，30 秒有界运行，发现崩溃即红） ----
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (clang + libFuzzer)
        run: |
          CC=clang CXX=clang++ cmake -B build-fuzz \
            -DENABLE_FUZZING=ON -DBUILD_TESTS=OFF

      - name: Build fuzz harness
        run: cmake --build build-fuzz --target mime_fuzz -j$(nproc)

      - name: Fuzz smoke (30s)
        run: |
          ./build-fuzz/mime_fuzz test/fuzz/corpus/mime \
            -max_total_time=30 -rss_limit_mb=2560 -malloc_limit_mb=512 \
            -artifact_prefix=./crash-
